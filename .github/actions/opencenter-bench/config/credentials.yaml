methods:
- id: clouds-file
  name: Existing clouds.yaml
  for:
  - flex
  envs:
  - openstack
  order: 1
  recommended: true
  summary: 'Use the profile you already have. Nothing is copied and nothing is written: the
    bench exports OS_CLOUD and OS_CLIENT_CONFIG_FILE and lets the CLI read your file directly.'
  fields:
  - id: os_cloud
    name: OS_CLOUD
    env: OS_CLOUD
    required: true
    placeholder: opencenter-lab
    help: The profile name inside clouds.yaml to authenticate as.
  - id: os_client_config_file
    name: clouds.yaml path
    env: OS_CLIENT_CONFIG_FILE
    required: false
    placeholder: ~/.config/openstack/clouds.yaml
    help: Leave empty to use the standard location.
  - id: os_region_name
    name: Region
    env: OS_REGION_NAME
    required: false
    placeholder: IAD3
    help: Overrides the region in the profile. Useful for multi-region tenants.
- id: application-credential
  name: Application credential
  for:
  - flex
  envs:
  - openstack
  order: 2
  recommended: true
  summary: The safest option for a test bench. Scoped to one project, revocable on its own,
    and it carries no password. The bench writes a clouds.yaml from these values into the
    sandbox and deletes it when the run ends.
  fields:
  - id: os_auth_url
    name: Auth URL
    env: OS_AUTH_URL
    required: true
    placeholder: https://keystone.iad3.api.rackspacecloud.com/v3
    help: The Keystone v3 endpoint for your region.
  - id: os_application_credential_id
    name: Application credential ID
    env: OS_APPLICATION_CREDENTIAL_ID
    required: true
    placeholder: 6d2e1f...
  - id: os_application_credential_secret
    name: Application credential secret
    env: OS_APPLICATION_CREDENTIAL_SECRET
    required: true
    secret: true
    help: Shown once when the credential is created. Store it in a password manager.
  - id: os_region_name
    name: Region
    env: OS_REGION_NAME
    required: true
    placeholder: IAD3
  - id: os_interface
    name: Endpoint interface
    env: OS_INTERFACE
    required: false
    default: public
    options:
    - public
    - internal
    - admin
- id: password
  name: Username and password
  for:
  - flex
  envs:
  - openstack
  order: 3
  recommended: false
  summary: Works everywhere, but the credential is your own login and cannot be scoped or
    revoked independently. Prefer an application credential for anything unattended.
  fields:
  - id: os_auth_url
    name: Auth URL
    env: OS_AUTH_URL
    required: true
    placeholder: https://keystone.iad3.api.rackspacecloud.com/v3
  - id: os_username
    name: Username
    env: OS_USERNAME
    required: true
  - id: os_password
    name: Password
    env: OS_PASSWORD
    required: true
    secret: true
  - id: os_project_name
    name: Project name
    env: OS_PROJECT_NAME
    required: true
    help: Give either a project name or a project ID.
  - id: os_project_id
    name: Project ID
    env: OS_PROJECT_ID
    required: false
  - id: os_user_domain_name
    name: User domain
    env: OS_USER_DOMAIN_NAME
    required: false
    default: Default
  - id: os_project_domain_name
    name: Project domain
    env: OS_PROJECT_DOMAIN_NAME
    required: false
    default: Default
  - id: os_region_name
    name: Region
    env: OS_REGION_NAME
    required: true
    placeholder: IAD3
- id: token
  name: Pre-issued token
  for:
  - flex
  envs:
  - openstack
  order: 4
  recommended: false
  summary: A short-lived scoped token, useful for reproducing an expiry failure on purpose.
    The bench also uses this shape to test what happens when a token is rejected mid-run.
  fields:
  - id: os_auth_url
    name: Auth URL
    env: OS_AUTH_URL
    required: true
  - id: os_token
    name: Token
    env: OS_TOKEN
    required: true
    secret: true
  - id: os_project_id
    name: Project ID
    env: OS_PROJECT_ID
    required: true
  - id: os_region_name
    name: Region
    env: OS_REGION_NAME
    required: true
- id: simulated
  name: Simulated (no account)
  for:
  - sim
  envs:
  - openstack
  order: 5
  recommended: true
  summary: Nothing to enter. The bench starts its own Keystone on loopback, writes a clouds.yaml
    pointing at it, and tears both down afterwards. The credentials are obvious placeholders
    and grant access to nothing.
  fields: []
- id: kind-local
  name: Local Kubernetes
  for:
  - kind
  envs:
  - kind
  order: 6
  recommended: true
  summary: Nothing to enter. Kind uses the container runtime already running as you, and every
    value below is filled in with what this bench actually uses, so the Kind environment is
    ready to run without typing anything.
  fields:
  - id: kind_provider
    name: Container runtime
    env: KIND_EXPERIMENTAL_PROVIDER
    required: false
    default: ''
    options:
    - ''
    - podman
    help: Empty means Docker. Set podman when Docker is not installed.
  - id: kind_cluster
    name: Cluster name
    env: OPENCLI_KIND_CLUSTER
    required: false
    default: opencli-testbench
    help: The cluster the Create cluster button builds. Its own name, so removing it can never
      touch a cluster you built yourself.
  - id: kind_kubeconfig
    name: Kubeconfig
    env: KUBECONFIG
    required: false
    default: ~/.cache/opencli-testbench/kubeconfig
    help: Written by the Create cluster button and handed to every command. Only this cluster's
      — the ambient KUBECONFIG could point anywhere, including production.
- id: vsphere
  name: vCenter
  for:
  - flex
  envs:
  - vmware
  order: 6.1
  recommended: true
  summary: What openCenter hands to the vSphere provider. It reads these from the cluster's
    secrets normally; setting them here lets the bench exercise the same path without a secrets
    store.
  fields:
  - id: vsphere_server
    name: vCenter host
    env: VSPHERE_SERVER
    required: true
    placeholder: vcenter.example.com
    help: Host only. openCenter strips a https:// prefix, so either works.
  - id: vsphere_user
    name: Username
    env: VSPHERE_USER
    required: true
    placeholder: administrator@vsphere.local
  - id: vsphere_password
    name: Password
    env: VSPHERE_PASSWORD
    required: true
    secret: true
- id: baremetal
  name: Bare metal inventory
  for:
  - local
  envs:
  - baremetal
  order: 6.2
  recommended: true
  summary: Bare metal has no cloud API to authenticate against. What it needs is an inventory
    of machines and a way to reach them.
  fields: []
- id: gitops
  name: GitOps repository
  for:
  - flex
  - kind
  envs:
  - openstack
  - vmware
  - baremetal
  - kind
  order: 7
  recommended: false
  summary: Only needed when a run should push what it generates. Left empty, the bench generates
    into a local bare repository inside the sandbox, which is enough to check that the manifests
    are valid and the push path works.
  fields:
  - id: git_repository
    name: Repository URL
    env: OPENCLI_GIT_REPOSITORY
    required: false
    default: file:///tmp/opencli-bench-gitops.git
    placeholder: git@github.com:your-org/your-cluster.git
    help: Prefilled with a local bare repository, which is what the bench uses when this is
      left alone. It exercises the whole push path without reaching anything outside this
      machine. Replace it with a real remote to test against one.
  - id: git_token
    name: Access token
    env: OPENCLI_GIT_TOKEN
    required: false
    secret: true
    help: For an HTTPS remote. Use an SSH key for an SSH remote.
  - id: git_ssh_key
    name: SSH private key path
    env: OPENCLI_GIT_SSH_KEY
    required: false
    placeholder: ~/.ssh/id_ed25519
- id: sops
  name: Secrets encryption
  for:
  - local
  - sim
  - flex
  - kind
  envs:
  - openstack
  - vmware
  - baremetal
  - kind
  order: 8
  recommended: false
  summary: Left empty, every run generates a throwaway Age key inside the sandbox and destroys
    it at the end — which is what you want, because a bench that encrypts to your real key
    leaves your real key in its artifacts.
  fields:
  - id: sops_age_key_file
    name: Age key file
    env: SOPS_AGE_KEY_FILE
    required: false
    placeholder: generated per run inside the sandbox
    help: Left as it is, each run generates a throwaway key and destroys it at the end — which
      is what you want, because a bench that encrypts to your real key leaves your real key
      in its artifacts. Only name a file here to reproduce a problem with a specific key.
  - id: sops_age_recipients
    name: Age recipients
    env: SOPS_AGE_RECIPIENTS
    required: false
    placeholder: age1...
