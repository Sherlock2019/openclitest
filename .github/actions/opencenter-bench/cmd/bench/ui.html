<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openCenter CLI test bench</title>
<style>
/* ---------------------------------------------------------------------------
   A workbench, laid out the way an editor is: activity bar, side bar, tabbed
   editor, bottom panel, status bar. The shape is borrowed on purpose — anyone
   who has used VS Code already knows where to look for the thing that failed.

   The front screen is one button. The thirty-row catalogue is still here, but
   under Advanced, because someone opening this for the first time wants to
   start a test, not read a specification.
   ------------------------------------------------------------------------ */
:root[data-theme="dark"] {
  --activity-bg:#333; --activity-fg:#858585; --activity-fg-active:#fff;
  --side-bg:#252526; --title-bg:#3c3c3c; --editor-bg:#1e1e1e; --panel-bg:#1e1e1e;
  --tab-bg:#2d2d2d; --tab-active-bg:#1e1e1e; --status-bg:#007acc; --status-fg:#fff;
  --fg:#ccc; --fg-dim:#858585; --fg-bright:#e7e7e7;
  --border:#2b2b2b; --border-strong:#454545; --hover:#2a2d2e; --select:#04395e;
  --accent:#0e639c; --accent-hover:#1177bb; --link:#3794ff;
  --pass:#73c991; --fail:#f14c4c; --warn:#cca700; --skip:#858585;
  --badge-bg:#4d4d4d; --input-bg:#3c3c3c; --input-border:#3c3c3c; --scroll:#424242;
}
:root[data-theme="light"] {
  --activity-bg:#2c2c2c; --activity-fg:#a5a5a5; --activity-fg-active:#fff;
  --side-bg:#f3f3f3; --title-bg:#ddd; --editor-bg:#fff; --panel-bg:#fff;
  --tab-bg:#ececec; --tab-active-bg:#fff; --status-bg:#007acc; --status-fg:#fff;
  --fg:#3b3b3b; --fg-dim:#6c6c6c; --fg-bright:#1b1b1b;
  --border:#e5e5e5; --border-strong:#c8c8c8; --hover:#e8e8e8; --select:#cce5ff;
  --accent:#005fb8; --accent-hover:#0258a8; --link:#005fb8;
  --pass:#16825d; --fail:#cd3131; --warn:#a67200; --skip:#6c6c6c;
  --badge-bg:#c4c4c4; --input-bg:#fff; --input-border:#cecece; --scroll:#c1c1c1;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--editor-bg);color:var(--fg);font-size:13px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Ubuntu",sans-serif}
.mono,code,pre,.path{font-family:"Cascadia Code",Menlo,Consolas,monospace;font-size:12px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--scroll)}
::-webkit-scrollbar-track{background:transparent}

.workbench{display:grid;grid-template-columns:48px auto 1fr;grid-template-rows:30px 1fr 22px;
  grid-template-areas:"title title title" "activity side main" "status status status";height:100vh}

.titlebar{grid-area:title;background:var(--title-bg);display:flex;align-items:center;gap:10px;
  padding:0 10px;font-size:12px;color:var(--fg-dim);user-select:none}
.titlebar .center{margin:0 auto;color:var(--fg)}
.titlebar .logo{color:var(--link);font-weight:700}
.titlebar button{background:none;border:none;color:var(--fg-dim);cursor:pointer;font:inherit;
  padding:2px 6px;border-radius:3px}
.titlebar button:hover{background:rgba(255,255,255,.12);color:var(--fg-bright)}

.activitybar{grid-area:activity;background:var(--activity-bg);display:flex;flex-direction:column;
  align-items:center;padding-top:4px}
.activitybar button{width:48px;height:48px;border:none;background:none;cursor:pointer;
  color:var(--activity-fg);display:grid;place-items:center;border-left:2px solid transparent;position:relative}
.activitybar button:hover{color:var(--activity-fg-active)}
.activitybar button[aria-selected="true"]{color:var(--activity-fg-active);border-left-color:var(--activity-fg-active)}
.activitybar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.4}
.activitybar .count{position:absolute;right:7px;bottom:8px;min-width:16px;height:16px;border-radius:8px;
  background:var(--status-bg);color:#fff;font-size:9px;line-height:16px;text-align:center;padding:0 4px;font-weight:600}
.activitybar .count.fail{background:var(--fail)}

.sidebar{grid-area:side;background:var(--side-bg);width:320px;display:flex;flex-direction:column;
  overflow:hidden;border-right:1px solid var(--border)}
.sidebar>header{padding:9px 20px 7px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--fg-dim);display:flex;gap:8px;align-items:center}
.sidebar>header .actions{margin-left:auto;display:flex;gap:2px}
.sidebar .body{flex:1;overflow-y:auto;padding-bottom:20px}

.main{grid-area:main;display:flex;flex-direction:column;overflow:hidden;background:var(--editor-bg)}
.statusbar{grid-area:status;background:var(--status-bg);color:var(--status-fg);display:flex;
  align-items:center;gap:14px;padding:0 10px;font-size:12px}
.statusbar .right{margin-left:auto;display:flex;gap:14px;align-items:center}
.statusbar .item{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.statusbar button{background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:0 6px;height:22px}
.statusbar button:hover{background:rgba(255,255,255,.18)}

.tabbar{display:flex;background:var(--tab-bg);overflow-x:auto;flex:none}
.tabbar .tab{padding:7px 12px;font-size:12.5px;color:var(--fg-dim);cursor:pointer;background:var(--tab-bg);
  border:none;border-right:1px solid var(--border);border-top:1px solid transparent;
  display:flex;align-items:center;gap:7px;white-space:nowrap}
.tabbar .tab[aria-selected="true"]{background:var(--tab-active-bg);color:var(--fg-bright);border-top-color:var(--status-bg)}
.editor{flex:1;overflow-y:auto;padding:26px 34px 60px}

.panel{flex:none;height:200px;border-top:1px solid var(--border-strong);background:var(--panel-bg);
  display:flex;flex-direction:column}
.panel.collapsed{height:35px}
.panel.collapsed .panel-body{display:none}
.panel header{display:flex;align-items:center;gap:16px;padding:0 12px;height:35px;flex:none}
.panel header .ptab{background:none;border:none;color:var(--fg-dim);cursor:pointer;font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;padding:8px 0;border-bottom:1px solid transparent}
.panel header .ptab[aria-selected="true"]{color:var(--fg-bright);border-bottom-color:var(--fg-bright)}
.panel header .spacer{flex:1}
.panel-body{flex:1;overflow:auto;padding:4px 12px 12px}
.panel-body pre{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--fg-dim)}

h1{font-size:24px;font-weight:400;color:var(--fg-bright);margin:0 0 8px}
h2{font-size:15px;font-weight:600;color:var(--fg-bright);margin:28px 0 10px}
h3{font-size:13px;font-weight:600;color:var(--fg-bright);margin:0 0 4px}
p{margin:0 0 10px;max-width:88ch}
.lede{color:var(--fg-dim);max-width:80ch;margin-bottom:22px;font-size:13.5px}
.muted{color:var(--fg-dim)}
a{color:var(--link)}
hr{border:none;border-top:1px solid var(--border);margin:26px 0}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-dim);font-weight:600}
tr.dim td:not(.state){opacity:.45}
td.num{width:40px;color:var(--fg-dim);font-variant-numeric:tabular-nums}
.example{font-family:"Cascadia Code",Menlo,Consolas,monospace;font-size:11.5px;color:var(--fg-dim)}

button.btn{font:inherit;font-size:12.5px;border:1px solid transparent;background:var(--accent);
  color:#fff;padding:5px 14px;border-radius:2px;cursor:pointer}
button.btn:hover:not(:disabled){background:var(--accent-hover)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn.big{font-size:14px;padding:10px 24px;font-weight:600}
button.btn.secondary{background:transparent;border-color:var(--border-strong);color:var(--fg)}
button.btn.secondary:hover:not(:disabled){background:var(--hover)}
button.btn.danger{background:transparent;border-color:var(--fail);color:var(--fail)}
button.icon{background:none;border:none;color:var(--fg-dim);cursor:pointer;padding:2px 4px;border-radius:3px;font-size:12px}
button.icon:hover{background:var(--hover);color:var(--fg-bright)}

input[type=text],input[type=password],select{font:inherit;font-size:12.5px;width:100%;padding:4px 8px;
  border-radius:2px;background:var(--input-bg);border:1px solid var(--input-border);color:var(--fg)}
input:focus,select:focus{outline:1px solid var(--link);outline-offset:-1px}
label.field{display:block;margin:0 0 12px}
label.field .name{display:block;font-size:11.5px;color:var(--fg-dim);margin-bottom:3px}
label.field .help{display:block;font-size:11px;color:var(--fg-dim);margin-top:3px}
.check{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;cursor:pointer;margin:6px 0}
.check input{margin-top:3px}

.tree .row{display:flex;align-items:center;gap:7px;padding:3px 20px 3px 12px;cursor:pointer;
  font-size:12.5px;white-space:nowrap;user-select:none}
.tree .row:hover{background:var(--hover)}
.tree .row[aria-selected="true"]{background:var(--select)}
.tree .row .label{overflow:hidden;text-overflow:ellipsis;flex:1}
.tree .row .n{color:var(--fg-dim);font-family:Menlo,Consolas,monospace;font-size:11px;width:18px;text-align:right}
.tree .group{padding:10px 12px 3px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-dim)}
.mark{width:13px;flex:none;text-align:center;font-family:Menlo,Consolas,monospace}
.mark.passed,.mark.pass{color:var(--pass)}
.mark.failed,.mark.fail{color:var(--fail)}
.mark.warning,.mark.blocked,.mark.error{color:var(--warn)}
.mark.skipped,.mark.locked,.mark.not_started,.mark.skip{color:var(--skip)}
.mark.running{color:var(--link)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:10px;background:var(--badge-bg);
  color:var(--fg-bright);font-size:10.5px;font-weight:600;line-height:16px;white-space:nowrap}
.badge.pass{background:rgba(115,201,145,.18);color:var(--pass)}
.badge.fail{background:rgba(241,76,76,.18);color:var(--fail)}
.badge.warn{background:rgba(204,167,0,.18);color:var(--warn)}
.badge.info{background:rgba(55,148,255,.16);color:var(--link)}
.badge.plain{background:transparent;color:var(--fg-dim);border:1px solid var(--border-strong)}

.sb-section{padding:10px 12px 14px;border-bottom:1px solid var(--border)}
.sb-section h4{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-dim);
  margin:0 0 8px;font-weight:600}

.result{border-bottom:1px solid var(--border)}
.result>summary{padding:7px 4px;cursor:pointer;display:flex;align-items:center;gap:9px;list-style:none}
.result>summary::-webkit-details-marker{display:none}
.result>summary:hover{background:var(--hover)}
.result .title{flex:1;min-width:0}
.result .title .name{color:var(--fg-bright)}
.result .title .cat{font-size:11px;color:var(--fg-dim)}
.result .ms{font-size:11px;color:var(--fg-dim);font-variant-numeric:tabular-nums}
.result-body{padding:4px 4px 14px 26px}
.assert{display:flex;gap:8px;padding:2px 0;font-size:12.5px;align-items:baseline}
.assert .detail{color:var(--fg-dim)}
.assert.fail .detail{color:var(--fail)}

pre.stream{margin:5px 0 0;padding:8px 10px;background:rgba(127,127,127,.09);
  border-left:2px solid var(--border-strong);overflow-x:auto;white-space:pre-wrap;word-break:break-word;
  max-height:240px;overflow-y:auto;color:var(--fg-dim)}
pre.stream.err{border-left-color:var(--fail)}
details.cmds{margin-top:10px}
details.cmds>summary{cursor:pointer;color:var(--link);font-size:12px}
.cmdline{margin-top:8px;font-family:Menlo,Consolas,monospace;font-size:12px}
.cmdline .exit{color:var(--fg-dim)}

.progress{height:3px;background:var(--border);overflow:hidden}
.progress>span{display:block;height:100%;width:0;background:var(--link);transition:width .3s}

.notice{padding:9px 12px;border-left:3px solid var(--warn);background:rgba(204,167,0,.10);
  font-size:12.5px;margin-bottom:14px}
.notice.error{border-left-color:var(--fail);background:rgba(241,76,76,.10)}
.notice.info{border-left-color:var(--link);background:rgba(55,148,255,.10)}
.notice.ok{border-left-color:var(--pass);background:rgba(115,201,145,.10)}
.empty{color:var(--fg-dim);padding:24px 4px}
.hidden{display:none !important}

/* --- the front screen --------------------------------------------------- */
.hero{max-width:720px;margin:36px auto 0}
.hero h1{font-size:28px;margin-bottom:14px}
.hero .lede{font-size:14px;margin-bottom:28px}
.hero .cta{margin:8px 0 30px}
.facts{display:grid;grid-template-columns:200px 1fr;gap:8px 18px;font-size:13px;
  border-top:1px solid var(--border);padding-top:20px}
.facts dt{color:var(--fg-dim)}
.facts dd{margin:0}
.agreement{border:1px solid var(--border-strong);border-radius:3px;padding:14px 16px;margin:22px 0}
.agreement h3{margin-bottom:6px}

.running{max-width:760px}
.running .of{color:var(--fg-dim);font-size:13px}
.running h1{font-size:26px;margin:2px 0 18px}
.running .qa{display:grid;grid-template-columns:120px 1fr;gap:6px 18px;font-size:13px;margin-bottom:22px}
.running .qa dt{color:var(--fg-dim)}
.running .qa dd{margin:0}
.neighbours{display:flex;gap:26px;font-size:12.5px;color:var(--fg-dim);margin-top:24px;
  border-top:1px solid var(--border);padding-top:14px}

.stat-row{display:flex;gap:30px;flex-wrap:wrap;margin:20px 0}
.stat .v{font-size:24px;font-variant-numeric:tabular-nums;color:var(--fg-bright);line-height:1.2}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-dim)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{border:1px solid var(--border);border-radius:3px;padding:12px 14px;background:rgba(127,127,127,.05)}
.steps{display:grid;gap:16px;max-width:92ch}
.step{display:grid;grid-template-columns:26px 1fr;gap:12px}
.step .num{color:var(--link);font-family:Menlo,Consolas,monospace;font-size:12px;padding-top:1px}

@media(max-width:860px){.sidebar{width:230px}.editor{padding:20px 16px 50px}}
</style>
</head>
<body>
<div class="workbench">

  <div class="titlebar">
    <span class="logo">◈</span>
    <span>openCenter CLI test bench</span>
    <span class="center" id="title-center">not started</span>
    <button id="theme-toggle" title="Toggle colour theme">theme</button>
  </div>

  <nav class="activitybar" id="activitybar" role="tablist" aria-label="Views"></nav>

  <aside class="sidebar">
    <header><span id="sidebar-title">Test run</span><span class="actions" id="sidebar-actions"></span></header>
    <div class="body" id="sidebar-body"></div>
  </aside>

  <div class="main">
    <div class="tabbar" id="tabbar"></div>
    <div class="progress"><span id="run-progress"></span></div>
    <div class="editor" id="editor"></div>
    <div class="panel collapsed" id="panel">
      <header>
        <button class="ptab" data-panel="problems" aria-selected="true">Problems</button>
        <button class="ptab" data-panel="output" aria-selected="false">Output</button>
        <button class="ptab" data-panel="terminal" aria-selected="false">Terminal</button>
        <span class="spacer"></span>
        <button class="icon" id="panel-toggle" title="Toggle panel">▁</button>
      </header>
      <div class="panel-body" id="panel-body"></div>
    </div>
  </div>

  <div class="statusbar">
    <button id="status-run" class="item">⏵ <span id="status-run-label">Full test</span></button>
    <span class="item" id="status-gate"></span>
    <span class="item" id="status-module"></span>
    <span class="right">
      <span class="item" id="status-counts"></span>
      <span class="item" id="status-time"></span>
      <span class="item" id="status-binary"></span>
    </span>
  </div>
</div>

<script>
"use strict";

/* --------------------------------------------------------------------------
   One workflow at a time, thirty modules, a handful of open tabs. Small
   enough to hold in one object rather than a framework.
   ----------------------------------------------------------------------- */
const app = {
  spec: null,
  plan: null,
  modules: new Map(),      // module id -> latest ModuleResult
  current: null,           // module id currently running
  currentCheck: "",
  run: null,               // the finished Run
  running: false,
  started: null,
  clock: null,
  view: "run",
  tab: "full",
  panelTab: "problems",
  log: [],
  preflight: null,
  options: { live: false, quick: false, keep: false, carryOn: false, providers: ["kind"] },
  agreed: new Set(),
  advancedEnv: "local",
  commands: null,
  commandRunning: null,
  commandOutput: {},
};

const $ = (id) => document.getElementById(id);
const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};
const clear = (node) => { while (node.firstChild) node.removeChild(node.firstChild); return node; };

const MARK = {
  passed: "✓", failed: "✕", warning: "!", blocked: "⊘", skipped: "–",
  locked: "🔒", not_started: "·", running: "…", cancelled: "×",
  pass: "✓", fail: "✕", skip: "–", error: "!",
};

const ICONS = {
  run: '<path d="M9 4h6M12 4v4"/><path d="M9 8l-4 9a4 4 0 0 0 3.6 5.8h6.8A4 4 0 0 0 19 17l-4-9z"/>',
  prerequisites: '<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/>',
  credentials: '<circle cx="8" cy="12" r="4"/><path d="M12 12h9M17 12v4M20 12v3"/>',
  reports: '<path d="M6 3h8l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  commands: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/>',
  advanced: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
};

const VIEWS = [
  { id: "run", label: "Test run", icon: "run" },
  { id: "commands", label: "Commands", icon: "commands" },
  { id: "prerequisites", label: "Prerequisites", icon: "prerequisites" },
  { id: "credentials", label: "Credentials", icon: "credentials" },
  { id: "reports", label: "Reports", icon: "reports" },
  { id: "advanced", label: "Advanced", icon: "advanced" },
];

/* --- boot ---------------------------------------------------------------- */

async function boot() {
  app.spec = await (await fetch("/api/state")).json();
  app.plan = await (await fetch("/api/workflow/plan")).json();

  if (app.spec.last_workflow) adoptRun(app.spec.last_workflow);

  renderActivityBar(); renderTabs(); renderSidebar(); renderEditor();
  renderStatus(); renderPanel();
  connectWorkflowEvents();
  wireGlobal();
  checkPrerequisites();
}

/* --- activity bar and side bar ------------------------------------------ */

function renderActivityBar() {
  const bar = clear($("activitybar"));
  for (const view of VIEWS) {
    const button = el("button");
    button.type = "button";
    button.title = view.label;
    button.setAttribute("aria-selected", String(view.id === app.view));
    button.innerHTML = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
      ICONS[view.icon] + "</svg>";
    if (view.id === "run" && app.modules.size) {
      const failed = [...app.modules.values()].filter((m) => m.state === "failed").length;
      button.append(el("span", "count" + (failed ? " fail" : ""), String(failed || app.modules.size)));
    }
    button.addEventListener("click", () => { app.view = view.id; renderActivityBar(); renderSidebar(); });
    bar.append(button);
  }
}

function renderSidebar() {
  $("sidebar-title").textContent = VIEWS.find((v) => v.id === app.view).label;
  clear($("sidebar-actions"));
  const body = clear($("sidebar-body"));
  ({
    run: sidebarRun,
    commands: sidebarCommands,
    prerequisites: sidebarPrerequisites,
    credentials: sidebarCredentials,
    reports: sidebarReports,
    advanced: sidebarAdvanced,
  })[app.view](body);
}

// The module list, grouped by phase and never reordered. Selecting a module
// opens it; it never lets a person skip ahead of a blocking one.
function sidebarRun(body) {
  const controls = el("div", "sb-section");
  const start = el("button", "btn", app.running ? "Running…" : "Start Full A-to-Z Test");
  start.disabled = app.running;
  start.addEventListener("click", startWorkflow);
  controls.append(start);
  if (app.running) {
    const stop = el("button", "btn danger", "Stop and clean up");
    stop.style.marginTop = "8px";
    stop.addEventListener("click", cancelWorkflow);
    controls.append(stop);
  }
  body.append(controls);

  for (const phase of app.plan.phases) {
    if (!phase.modules || !phase.modules.length) continue;
    const tree = el("div", "tree");
    tree.append(el("div", "group", phase.name));
    for (const moduleID of phase.modules) {
      const module = app.plan.modules.find((m) => m.id === moduleID);
      if (!module) continue;
      const result = app.modules.get(moduleID);
      let state = result ? result.state : "not_started";
      if (app.current === moduleID) state = "running";
      if (!result && module.live && !app.options.live) state = "locked";

      const row = el("div", "row");
      row.setAttribute("aria-selected", String(app.tab === "module:" + moduleID));
      row.append(el("span", "n", String(module.order)));
      row.append(el("span", "mark " + state, MARK[state] || "·"));
      row.append(el("span", "label", module.name));
      if (module.blocking) row.append(el("span", "badge plain", "blocking"));
      row.addEventListener("click", () => openTab("module:" + moduleID, module.name));
      tree.append(row);
    }
    body.append(tree);
  }
}

// The output arrives as a plain text stream, so it is appended as it comes
// rather than after the command has finished.
async function runCommand(command) {
  app.commandRunning = command.id;
  app.commandOutput[command.id] = "";
  renderEditor(); renderSidebar();

  try {
    const response = await fetch("/api/commands/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: command.id }),
    });
    if (!response.ok) {
      app.commandOutput[command.id] = await response.text();
      return;
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    for (;;) {
      const chunk = await reader.read();
      if (chunk.done) break;
      app.commandOutput[command.id] += decoder.decode(chunk.value, { stream: true });
      const terminal = $("command-output");
      if (terminal) {
        terminal.textContent = app.commandOutput[command.id];
        terminal.scrollTop = terminal.scrollHeight;
      }
    }
  } catch (error) {
    app.commandOutput[command.id] += "\n" + error;
  } finally {
    app.commandRunning = null;
    renderEditor(); renderSidebar();
  }
}

function renderCredentialFields(methodID) {
  const method = (app.spec.credentials || []).find((m) => m.id === methodID);
  const container = clear($("cred-fields"));
  if (!method) return;
  container.append(el("div", "muted", method.summary));
  const saved = app.spec.saved_credentials || {};

  for (const field of method.fields) {
    const label = el("label", "field");
    label.style.marginTop = "12px";
    label.append(el("span", "name", field.name + (field.required ? " *" : "")));
    let input;
    if (field.options && field.options.length) {
      input = el("select");
      for (const option of field.options) input.append(new Option(option || "(default)", option));
      input.value = saved[field.env] || field.default || "";
    } else {
      input = el("input");
      input.type = field.secret ? "password" : "text";
      input.placeholder = field.placeholder || "";
      const stored = saved[field.env];
      if (stored === "__saved__") { input.placeholder = "saved — leave blank to keep it"; input.value = ""; }
      else input.value = stored !== undefined ? stored : (field.default || "");
    }
    input.dataset.env = field.env;
    label.append(input);
    if (field.help) label.append(el("span", "help", field.help));
    if (field.env) label.append(el("span", "help mono", field.env));
    container.append(label);
  }
}

/* --- editor tabs --------------------------------------------------------- */

let openTabs = [{ id: "full", label: "Full test" }];

function openTab(id, label) {
  if (!openTabs.find((tab) => tab.id === id)) openTabs.push({ id, label, closable: true });
  app.tab = id;
  renderTabs(); renderEditor(); renderSidebar();
}

function renderTabs() {
  const bar = clear($("tabbar"));
  for (const tab of openTabs) {
    const button = el("button", "tab");
    button.setAttribute("aria-selected", String(tab.id === app.tab));
    button.append(document.createTextNode(tab.label));
    if (tab.closable) {
      const close = el("span", "", "✕");
      close.style.opacity = ".6";
      close.addEventListener("click", (event) => {
        event.stopPropagation();
        openTabs = openTabs.filter((other) => other.id !== tab.id);
        if (app.tab === tab.id) app.tab = "full";
        renderTabs(); renderEditor();
      });
      button.append(close);
    }
    button.addEventListener("click", () => { app.tab = tab.id; renderTabs(); renderEditor(); });
    bar.append(button);
  }
}

function renderEditor() {
  const editor = clear($("editor"));
  if (app.tab === "full") return editorFull(editor);
  if (app.tab === "prereq") return editorPrerequisites(editor);
  if (app.tab === "what") return editorWhat(editor);
  if (app.tab === "why") return editorWhy(editor);
  if (app.tab === "how") return editorHow(editor);
  if (app.tab === "catalogue") return editorCatalogue(editor);
  if (app.tab.startsWith("module:")) return editorModule(editor, app.tab.slice(7));
  if (app.tab.startsWith("command:")) return editorCommand(editor, app.tab.slice(8));
}

function editorFull(editor) {
  if (app.running) return editorRunning(editor);
  if (app.run) return editorFinished(editor);
  return editorIdle(editor);
}

// The agreement is the only thing between a click and a real deployment, so it
// is on the front screen rather than hidden behind a settings page.
function agreementBlock() {
  const block = el("div", "agreement");
  block.append(el("h3", null, app.plan.safety_agreement.title));
  block.append(el("p", "muted", app.plan.safety_agreement.preamble));

  block.append(toggle("live", "Enable Module 29 — the real disposable deployment",
    app.options.live, (value) => {
      app.options.live = value;
      renderEditor(); renderSidebar(); renderStatus();
    }));

  if (app.options.live) {
    for (const confirmation of app.plan.safety_agreement.confirmations) {
      block.append(toggle("agree-" + confirmation.id, confirmation.text,
        app.agreed.has(confirmation.id), (value) => {
          if (value) app.agreed.add(confirmation.id); else app.agreed.delete(confirmation.id);
          renderEditor();
        }));
    }
    if (!app.spec.mutate_allowed) {
      block.append(el("div", "notice error",
        "Ticking these is consent; the environment variable is intent, and both are needed. " +
        "Restart the console with " + app.plan.mutate_gate + "=1."));
    } else if (!liveReady()) {
      block.append(el("div", "notice", "All three confirmations are required."));
    } else {
      block.append(el("div", "notice ok",
        "Module 29 is unlocked. It will create and destroy a real " +
        app.options.providers.join(" and ") + " cluster."));
    }
  }
  return block;
}

function toggle(id, text, checked, onChange) {
  const label = el("label", "check");
  const box = el("input");
  box.type = "checkbox";
  box.checked = !!checked;
  box.addEventListener("change", () => onChange(box.checked));
  label.append(box, el("span", null, text));
  return label;
}

function liveReady() {
  if (!app.options.live) return false;
  if (!app.spec.mutate_allowed) return false;
  return app.plan.safety_agreement.confirmations.every((c) => app.agreed.has(c.id));
}

function estimate() {
  const seconds = app.plan.estimated_seconds || 0;
  const withLive = app.options.live ? seconds : seconds;
  const minutes = Math.round(withLive / 60);
  const base = minutes < 1 ? "under a minute" : "about " + minutes + " minutes";
  return app.preflight ? base : base + " (recalculated after the prerequisite scan)";
}

function blockingPrerequisites() {
  if (!app.preflight) return [];
  const needed = new Set(["opencenter"]);
  for (const module of app.plan.modules) {
    if (module.live && !app.options.live) continue;
    for (const id of module.requires || []) needed.add(id);
  }
  return app.preflight.results
    .filter((item) => needed.has(item.id) && item.status !== "present")
    .map((item) => item.name);
}

/* --- the running screen -------------------------------------------------- */

function editorRunning(editor) {
  const module = app.plan.modules.find((m) => m.id === app.current);
  const box = el("div", "running");

  if (!module) {
    box.append(el("h1", null, "Preparing the test environment"));
    box.append(el("p", "lede",
      "Phase 0 — checking the machine, the tools and the credentials. Nothing has been created yet."));
    if (app.preflight) {
      box.append(el("p", "muted",
        app.preflight.present + " prerequisites present, " + app.preflight.missing + " missing."));
    }
    editor.append(box);
    return;
  }

  box.append(el("div", "of", "Module " + module.order + " of " + app.plan.modules.length +
    "  ·  " + module.phase_name));
  box.append(el("h1", null, module.name));

  const qa = el("dl", "qa");
  const line = (key, value) => { qa.append(el("dt", null, key), el("dd", null, value)); };
  line("Question", module.question);
  line("Looking for", module.looking_for);
  line("Example", module.example);
  if (app.currentCheck) line("Current check", app.currentCheck);
  box.append(qa);

  const done = [...app.modules.values()].length;
  const bar = el("div", "muted");
  bar.textContent = done + " of " + app.plan.modules.length + " modules finished";
  box.append(bar);

  const stop = el("button", "btn danger");
  stop.textContent = "Stop and clean up";
  stop.style.marginTop = "18px";
  stop.addEventListener("click", cancelWorkflow);
  box.append(stop);

  const previous = app.plan.modules[module.order - 2];
  const next = app.plan.modules[module.order];
  const neighbours = el("div", "neighbours");
  if (previous) {
    const result = app.modules.get(previous.id);
    neighbours.append(el("span", null,
      "Previous: " + previous.name + (result ? " — " + stateLabel(result.state) : "")));
  }
  if (next) neighbours.append(el("span", null, "Next: " + next.name));
  box.append(neighbours);

  editor.append(box);
}

function editorFinished(editor) {
  const run = app.run;
  editor.append(el("h1", null, "Full openCenter CLI Test"));

  const verdict = run.failed ? "error" : (run.blocked || run.skipped || run.not_run ? "" : "ok");
  editor.append(el("div", "notice " + verdict, verdictText(run)));

  const stats = el("div", "stat-row");
  for (const cell of [
    ["passed", run.passed, "var(--pass)"],
    ["failed", run.failed, run.failed ? "var(--fail)" : ""],
    ["warning", run.warning, run.warning ? "var(--warn)" : ""],
    ["blocked", run.blocked, run.blocked ? "var(--warn)" : ""],
    ["skipped", run.skipped, ""],
    ["not run", run.not_run, run.not_run ? "var(--warn)" : ""],
    ["minutes", (run.millis / 60000).toFixed(1), ""],
  ]) {
    const stat = el("div", "stat");
    const value = el("div", "v", String(cell[1]));
    if (cell[2]) value.style.color = cell[2];
    stat.append(value, el("div", "k", cell[0]));
    stats.append(stat);
  }
  editor.append(stats);

  const again = el("button", "btn");
  again.textContent = "Run again";
  again.addEventListener("click", () => { app.run = null; renderEditor(); });
  const openReport = el("button", "btn secondary");
  openReport.textContent = "Open the report";
  openReport.style.marginLeft = "8px";
  openReport.addEventListener("click", () => window.open("/api/workflow/report/" + run.id, "_blank"));

  const csv = el("button", "btn secondary");
  csv.textContent = "Download CSV";
  csv.style.marginLeft = "8px";
  csv.addEventListener("click", () => {
    window.location.href = "/api/export/" + run.id + "/results.csv";
  });

  const markdown = el("button", "btn secondary");
  markdown.textContent = "Download Markdown";
  markdown.style.marginLeft = "8px";
  markdown.addEventListener("click", () => {
    window.location.href = "/api/export/" + run.id + "/report.md";
  });

  editor.append(again, openReport, csv, markdown);
  const formats = el("p", "muted");
  formats.style.marginTop = "10px";
  formats.textContent = "JSON, Markdown, HTML, JUnit XML and CSV are all written into the run folder too.";
  editor.append(formats);

  editor.append(el("h2", null, "Modules"));
  const table = el("table");
  const head = el("thead");
  const headRow = el("tr");
  for (const heading of ["#", "Module", "Result", "Checks", "Duration", "Note"]) {
    headRow.append(el("th", null, heading));
  }
  head.append(headRow);
  table.append(head);

  const tbody = el("tbody");
  for (const module of run.modules) {
    const row = el("tr");
    row.style.cursor = "pointer";
    row.append(el("td", "num", String(module.order)));
    row.append(el("td", null, module.name));
    const state = el("td");
    state.append(el("span", "mark " + module.state, MARK[module.state] || "·"),
      document.createTextNode(" " + stateLabel(module.state)));
    row.append(state);
    const total = module.passed + module.failed + module.skipped + module.errored;
    row.append(el("td", null, total ? module.passed + "/" + total : "—"));
    row.append(el("td", null, module.millis ? (module.millis / 1000).toFixed(1) + "s" : "—"));
    row.append(el("td", "muted", module.message || ""));
    row.addEventListener("click", () => openTab("module:" + module.id, module.name));
    tbody.append(row);
  }
  table.append(tbody);
  editor.append(table);

  const unanswered = run.modules.filter((m) => !["passed", "failed", "warning"].includes(m.state));
  if (unanswered.length) {
    editor.append(el("h2", null, "Questions this run did not answer"));
    editor.append(el("p", "muted",
      "These are not passes. Nothing below was executed, and the report says so in every format."));
    const list = el("table");
    const listBody = el("tbody");
    for (const module of unanswered) {
      const row = el("tr");
      row.append(el("td", null, module.name));
      row.append(el("td", null, stateLabel(module.state)));
      row.append(el("td", "muted", module.message || ""));
      listBody.append(row);
    }
    list.append(listBody);
    editor.append(list);
  }

  if (run.resources && run.resources.length) {
    editor.append(el("h2", null, "Resources created, and what became of them"));
    const resources = el("table");
    const resourceBody = el("tbody");
    for (const resource of run.resources) {
      const row = el("tr");
      row.append(el("td", null, resource.type));
      row.append(el("td", null, resource.name));
      row.append(el("td", null, resource.provider));
      const gone = resource.cleanup_status === "deleted" || resource.cleanup_status === "not_found";
      row.append(el("td", gone ? "" : "muted", gone ? "confirmed gone" : resource.cleanup_status));
      resourceBody.append(row);
    }
    resources.append(resourceBody);
    editor.append(resources);
  }
}

function verdictText(run) {
  if (run.failed) return run.failed + " of " + run.modules.length + " modules failed.";
  const gaps = run.blocked + run.skipped + run.not_run;
  if (gaps) return run.passed + " modules passed, " + gaps + " did not run. A gap is not a pass.";
  return "All " + run.modules.length + " modules passed.";
}

function stateLabel(state) {
  return ({
    passed: "Passed", failed: "Failed", warning: "Warning", blocked: "Blocked",
    skipped: "Skipped", locked: "Locked", cancelled: "Cancelled", not_started: "Not run",
    running: "Running",
  })[state] || state;
}

/* --- one module ---------------------------------------------------------- */

function editorModule(editor, moduleID) {
  const module = app.plan.modules.find((m) => m.id === moduleID);
  if (!module) return;
  const result = app.modules.get(moduleID);

  editor.append(el("div", "of", "Module " + module.order + " of 30 · " + module.phase_name));
  editor.append(el("h1", null, module.name));

  const qa = el("dl", "qa");
  const line = (key, value) => { if (value) qa.append(el("dt", null, key), el("dd", null, value)); };
  line("Question", module.question);
  line("Looking for", module.looking_for);
  line("Example", module.example);
  line("Blocking", module.blocking ? "yes — a failure here stops the workflow" : "no");
  line("Live", module.live ? "yes — creates real infrastructure" : "no");
  line("Needs", (module.requires || []).join(", "));
  editor.append(qa);
  if (module.note) editor.append(el("div", "notice info", module.note));

  if (!result) {
    editor.append(el("div", "empty", "This module has not run yet."));
    return;
  }
  if (result.message) {
    editor.append(el("div", "notice " + (result.state === "failed" ? "error" : "info"), result.message));
  }
  for (const check of result.results || []) editor.append(renderResult(check));
}

function renderResult(result) {
  const box = el("details", "result");
  box.dataset.check = result.id;
  if (result.status === "fail" || result.status === "error") box.open = true;

  const summary = el("summary");
  summary.append(el("span", "mark " + result.status, MARK[result.status] || "·"));
  const title = el("div", "title");
  title.append(el("div", "name", result.name), el("div", "cat", result.id));
  summary.append(title, el("span", "ms", result.millis + " ms"));
  box.append(summary);

  const body = el("div", "result-body");
  for (const assertion of result.assertions || []) {
    const row = el("div", "assert " + assertion.status);
    row.append(el("span", "mark " + assertion.status, MARK[assertion.status] || "·"));
    const text = el("span");
    text.append(el("span", null, assertion.name));
    // The detail explains a failure; beside a pass it reads as a contradiction.
    if (assertion.detail && assertion.status !== "pass") {
      text.append(document.createTextNode(" — "), el("span", "detail", assertion.detail));
    }
    row.append(text);
    body.append(row);
  }

  const commands = result.commands || [];
  if (commands.length) {
    const details = el("details", "cmds");
    details.append(el("summary", null, commands.length + " commands run"));
    for (const invocation of commands) {
      const line = el("div", "cmdline");
      line.append(el("span", null, "$ " + invocation.command));
      line.append(el("span", "exit", "   → exit " + invocation.exit_code +
        (invocation.timed_out ? " (timed out)" : "")));
      details.append(line);
      if (invocation.stdout) details.append(el("pre", "stream", invocation.stdout));
      if (invocation.stderr) details.append(el("pre", "stream err", invocation.stderr));
    }
    body.append(details);
  }
  box.append(body);
  return box;
}

/* --- advanced reference tabs --------------------------------------------- */

function editorWhat(editor) {
  const about = app.spec.about;
  editor.append(el("h1", null, about.what.title));
  editor.append(el("p", "lede", about.what.summary));
  editorCatalogueTable(editor);
}

function editorCatalogue(editor) {
  editor.append(el("h1", null, "Test catalogue"));
  editor.append(el("p", "lede",
    "Every module, the question it answers and what this run found. This is the detail behind " +
    "the front screen; it is here rather than there because a first-time reader wants to start " +
    "a test, not read a specification."));
  editorCatalogueTable(editor);
}

function editorCatalogueTable(editor) {
  const table = el("table");
  const head = el("thead");
  const headRow = el("tr");
  for (const heading of ["#", "What we test", "Simple question", "What we are looking for",
    "openCenter example", "This run"]) headRow.append(el("th", null, heading));
  head.append(headRow);
  table.append(head);

  const tbody = el("tbody");
  for (const module of app.plan.modules) {
    const category = app.spec.categories.find((c) => c.id === module.id) || {};
    const result = app.modules.get(module.id);
    const row = el("tr");
    row.style.cursor = "pointer";
    row.append(el("td", "num", String(module.order)));
    row.append(el("td", null, module.name));
    row.append(el("td", "muted", category.question || ""));
    row.append(el("td", "muted", category.looking_for || ""));
    row.append(el("td", "example", category.example || ""));

    const state = el("td", "state");
    if (result) {
      const tone = { passed: "pass", failed: "fail", warning: "warn", blocked: "warn" }[result.state] || "plain";
      state.append(el("span", "badge " + tone, stateLabel(result.state)));
    } else {
      state.append(el("span", "badge plain", "not run"));
    }
    row.append(state);
    row.addEventListener("click", () => openTab("module:" + module.id, module.name));
    tbody.append(row);
  }
  table.append(tbody);
  editor.append(table);
}

function editorWhy(editor) {
  const about = app.spec.about;
  editor.append(el("h1", null, about.why.title));
  editor.append(el("p", "lede", about.why.summary));
  const grid = el("div", "grid-cards");
  for (const goal of about.why.goals) {
    const card = el("div", "card");
    card.append(el("h3", null, goal.name), el("div", null, goal.meaning));
    const detail = el("p", "muted", goal.detail);
    detail.style.marginTop = "8px";
    card.append(detail);
    grid.append(card);
  }
  editor.append(grid);
}

function editorHow(editor) {
  const about = app.spec.about;
  editor.append(el("h1", null, about.how.title));
  editor.append(el("p", "lede", about.how.summary));
  const steps = el("div", "steps");
  about.how.steps.forEach((step, index) => {
    const row = el("div", "step");
    row.append(el("div", "num", String(index + 1).padStart(2, "0")));
    const text = el("div");
    text.append(el("h3", null, step.name), el("p", "muted", step.detail));
    row.append(text);
    steps.append(row);
  });
  editor.append(steps);

  editor.append(el("h2", null, "The five phases"));
  const table = el("table");
  const tbody = el("tbody");
  for (const phase of app.plan.phases) {
    const row = el("tr");
    row.append(el("td", "num", String(phase.order)));
    row.append(el("td", null, phase.name));
    row.append(el("td", "muted", phase.summary));
    row.append(el("td", "num", phase.modules ? String(phase.modules.length) : "—"));
    tbody.append(row);
  }
  table.append(tbody);
  editor.append(table);
}

function editorPrerequisites(editor) {
  editor.append(el("h1", null, "Prerequisites"));
  editor.append(el("p", "lede",
    "Every probe below is read-only: it asks whether something is present or reachable and changes nothing."));
  if (!app.preflight) { editor.append(el("div", "empty", "Checking…")); return; }

  let group = "";
  for (const item of app.preflight.results) {
    if (item.group_name !== group) { group = item.group_name; editor.append(el("h2", null, group)); }
    const present = item.status === "present";
    const box = el("details", "result");
    const summary = el("summary");
    summary.append(el("span", "mark " + (present ? "passed" : "failed"), present ? MARK.passed : MARK.failed));
    const title = el("div", "title");
    title.append(el("div", "name", item.name), el("div", "cat", present ? item.detail : item.why));
    summary.append(title, el("span", "ms", item.millis + " ms"));
    box.append(summary);

    const body = el("div", "result-body");
    body.append(el("div", "muted", item.why));
    body.append(el("div", "muted", "the probe that was run"), el("pre", "stream", item.check));
    if (!present && item.install) {
      body.append(el("div", "muted", "how to install it"), el("pre", "stream", item.install.trim()));
      box.open = true;
    }
    box.append(body);
    editor.append(box);
  }
}

/* --- panel --------------------------------------------------------------- */

function renderPanel() {
  const body = clear($("panel-body"));
  if (app.panelTab === "output") {
    body.append(el("pre", null, app.log.join("\n") || "waiting…"));
    body.scrollTop = body.scrollHeight;
    return;
  }
  if (app.panelTab === "terminal") {
    const lines = [];
    for (const module of app.modules.values()) {
      for (const result of module.results || []) {
        for (const invocation of result.commands || []) {
          lines.push("$ " + invocation.command + "    → exit " + invocation.exit_code);
        }
      }
    }
    body.append(el("pre", null, lines.join("\n") || "No commands have been run yet."));
    return;
  }

  const problems = [];
  for (const module of app.modules.values()) {
    for (const result of module.results || []) {
      if (result.status !== "fail" && result.status !== "error") continue;
      for (const assertion of result.assertions || []) {
        if (assertion.status === "fail") {
          problems.push({ module, name: assertion.name, detail: assertion.detail, check: result.id });
        }
      }
    }
    if (module.state === "blocked" || module.state === "failed") {
      if (!(module.results || []).length) {
        problems.push({ module, name: module.name, detail: module.message, check: "" });
      }
    }
  }
  if (!problems.length) {
    body.append(el("div", "muted", app.modules.size ? "No problems have been detected." : "No run yet."));
    return;
  }
  for (const problem of problems) {
    const row = el("div", "assert fail");
    row.style.cursor = "pointer";
    row.append(el("span", "mark fail", MARK.fail));
    const text = el("span");
    text.append(el("span", null, problem.name));
    if (problem.detail) text.append(document.createTextNode(" — "), el("span", "detail", problem.detail));
    text.append(el("span", "cat", "  module " + problem.module.order + " · " + problem.module.name));
    row.append(text);
    row.addEventListener("click", () => openTab("module:" + problem.module.id, problem.module.name));
    body.append(row);
  }
}

/* --- status bar ---------------------------------------------------------- */

function renderStatus() {
  $("status-run-label").textContent = app.running ? "Running" : "Full test";
  $("status-gate").textContent = app.spec.mutate_allowed
    ? "⚠ " + app.plan.mutate_gate + "=1"
    : "🔒 read-only";

  const module = app.plan.modules.find((m) => m.id === app.current);
  $("status-module").textContent = module
    ? "Module " + module.order + " of " + app.plan.modules.length
    : "";

  let passed = 0, failed = 0;
  for (const result of app.modules.values()) {
    if (result.state === "passed") passed++;
    if (result.state === "failed") failed++;
  }
  $("status-counts").textContent = app.modules.size ? "✓ " + passed + "   ✕ " + failed : "";
  $("status-binary").textContent = app.spec.binary_version || "no binary";
}

/* --- running the workflow ------------------------------------------------ */

async function startWorkflow() {
  if (app.options.live && !liveReady()) {
    app.tab = "full";
    renderTabs(); renderEditor();
    appendLog("Module 29 needs all three confirmations and " + app.plan.mutate_gate + "=1.");
    return;
  }

  app.modules.clear();
  app.run = null;
  app.current = null;
  app.log = [];
  setRunning(true);
  renderEditor(); renderSidebar(); renderPanel(); renderActivityBar();

  const response = await fetch("/api/workflow/start", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      live: liveReady(),
      live_providers: app.options.providers,
      agreed: [...app.agreed],
      quick: app.options.quick,
      keep_workspace: app.options.keep,
      continue_on_failure: app.options.carryOn,
      credentials: collectCredentials(),
    }),
  });
  if (!response.ok) {
    const body = await response.json().catch(() => ({ error: "could not start" }));
    appendLog("could not start: " + body.error);
    app.panelTab = "output";
    renderPanelTabs();
    setRunning(false);
    renderEditor();
  }
}

function cancelWorkflow() {
  fetch("/api/workflow/cancel", { method: "POST" });
  appendLog("cancelling — cleanup still runs");
}

function setRunning(running) {
  app.running = running;
  $("title-center").textContent = running ? "running" : (app.run ? verdictText(app.run) : "not started");
  if (running && !app.clock) {
    app.started = Date.now();
    app.clock = setInterval(() => {
      $("status-time").textContent = ((Date.now() - app.started) / 1000).toFixed(0) + "s";
    }, 500);
  } else if (!running && app.clock) {
    clearInterval(app.clock);
    app.clock = null;
  }
  renderStatus();
}

function connectWorkflowEvents() {
  const source = new EventSource("/api/workflow/events");
  source.onmessage = (message) => {
    let event;
    try { event = JSON.parse(message.data); } catch (error) { return; }
    handleWorkflowEvent(event);
  };
}

function handleWorkflowEvent(event) {
  switch (event.type) {
    case "run-start":
      setRunning(true);
      appendLog(event.message);
      break;
    case "phase":
    case "preflight":
    case "log":
    case "reports":
      appendLog(event.message);
      break;
    case "module-start":
      app.current = event.module_id;
      app.currentCheck = "";
      setProgress(event.order - 1, event.total);
      redraw();
      break;
    case "assertion":
      app.currentCheck = event.step ? event.step.name : "";
      break;
    case "check-done":
      app.currentCheck = "";
      break;
    case "module-done":
      app.modules.set(event.module.id, event.module);
      app.current = null;
      setProgress(event.order, event.total);
      redraw();
      break;
    case "run-error":
      appendLog("stopped: " + event.message);
      app.panelTab = "output";
      renderPanelTabs();
      setRunning(false);
      redraw();
      break;
    case "run-done":
      adoptRun(event.run);
      setRunning(false);
      setProgress(1, 1);
      redraw();
      break;
  }
}

function adoptRun(run) {
  app.run = run;
  app.current = null;
  for (const module of run.modules || []) app.modules.set(module.id, module);
}

// Redrawing everything on each module is cheap at this size and keeps the
// sidebar, tabs, panel and status bar from drifting out of step.
let queued = false;
function redraw() {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => {
    queued = false;
    renderSidebar(); renderTabs(); renderStatus(); renderPanel(); renderActivityBar(); renderEditor();
  });
}

function setProgress(done, total) {
  $("run-progress").style.width = total ? (100 * done / total) + "%" : "0";
}

/* --- prerequisites and credentials --------------------------------------- */

async function checkPrerequisites() {
  app.preflight = null;
  if (app.view === "prerequisites") renderSidebar();
  try {
    app.preflight = await (await fetch("/api/preflight")).json();
  } catch (error) {
    appendLog("prerequisite check failed: " + error);
    app.preflight = { results: [], present: 0, missing: 0 };
  }
  if (app.view === "prerequisites") renderSidebar();
  if (app.tab === "prereq" || app.tab === "full") renderEditor();
}

function collectCredentials() {
  const container = $("cred-fields");
  const out = {};
  if (!container) return out;
  for (const input of container.querySelectorAll("[data-env]")) {
    const value = input.value.trim();
    if (value) out[input.dataset.env] = value;
  }
  return out;
}

async function saveCredentials() {
  const status = $("cred-status");
  if (status) status.textContent = "saving…";
  const response = await fetch("/api/credentials", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(collectCredentials()),
  });
  if (status) status.textContent = response.ok ? "saved to config/credentials.local.yaml" : "could not save";
  app.spec.saved_credentials = (await (await fetch("/api/state")).json()).saved_credentials;
}

/* --- misc ---------------------------------------------------------------- */

function appendLog(message) {
  if (!message) return;
  app.log.push(new Date().toLocaleTimeString() + "  " + message);
  if (app.panelTab === "output") renderPanel();
}

function renderPanelTabs() {
  for (const tab of document.querySelectorAll(".ptab")) {
    tab.setAttribute("aria-selected", String(tab.dataset.panel === app.panelTab));
  }
  $("panel").classList.remove("collapsed");
  renderPanel();
}

function wireGlobal() {
  for (const tab of document.querySelectorAll(".ptab")) {
    tab.addEventListener("click", () => { app.panelTab = tab.dataset.panel; renderPanelTabs(); });
  }
  $("panel-toggle").addEventListener("click", () => $("panel").classList.toggle("collapsed"));
  $("status-run").addEventListener("click", () => {
    app.view = "run"; app.tab = "full";
    renderActivityBar(); renderSidebar(); renderTabs(); renderEditor();
  });
  $("theme-toggle").addEventListener("click", () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  });
  document.addEventListener("keydown", (event) => {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter" && !app.running) {
      event.preventDefault();
      startWorkflow();
    }
  });
}

boot();
</script>
</body>
</html>
